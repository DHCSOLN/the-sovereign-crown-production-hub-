name: Automated Performance Monitor & Boost Generator

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  audit_and_boost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python Environment
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Align and Pull Remote State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: Execute Boost Analysis
        env:
          SOCIAL_ANALYTICS_API_KEY: ${{ secrets.SOCIAL_ANALYTICS_API_KEY }}
        run: |
          python clement_ip_hub.py

      - name: Commit and Push Updated Boost Metrics
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automation Engine: Updated boost templates for underperforming platforms"
          push_options: '--force'

      - name: Print Calculated Copy to GitHub Email Logs
        run: |
          echo "=================================================="
          echo "🚨 CLEMENT IP HUB: RE-CROSS PROMOTION GENERATION LOG 🚨"
          echo "=================================================="
          cat sources.json || echo "sources.json not found"
          echo "=================================================="
