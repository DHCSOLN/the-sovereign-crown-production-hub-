name: OpenShift Readiness and Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/openshift.yml"
      - "clement_ip_hub.py"

permissions:
  contents: write

jobs:
  openshift-ci-cd:
    name: Check readiness and deploy when configured
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Execute Verified Core Matrix Hub
        env:
          SOCIAL_ANALYTICS_API_KEY: ${{ secrets.SOCIAL_ANALYTICS_API_KEY }}
        run: |
          python clement_ip_hub.py
